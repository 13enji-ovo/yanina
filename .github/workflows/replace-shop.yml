name: Replace shop file

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move yanina.html to tienda/index.html
        run: |
          mv -f yanina.html tienda/index.html
          rm -f .github/workflows/replace-shop.yml
          git config user.name "13enji-ovo"
          git config user.email "13enji-ovo@users.noreply.github.com"
          git add -A
          git commit -m "Remove Lolobuy, checkout via WhatsApp"
          git push
