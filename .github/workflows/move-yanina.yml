name: Move yanina.html to tienda/index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move yanina.html to tienda/index.html
        run: |
          mv yanina.html tienda/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tienda/index.html yanina.html
          git commit -m "Update tienda/index.html from yanina.html" || echo "No changes to commit"
          git push
