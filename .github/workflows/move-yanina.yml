name: Move yanina.html to tienda/index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move uploaded file into place
        run: |
          mv yanina.html tienda/index.html
          git config user.name "13enji-ovo"
          git config user.email "13enji-ovo@users.noreply.github.com"
          git add tienda/index.html yanina.html
          git commit -m "Replace tienda/index.html with updated sharpened store page" || echo "nothing to commit"
          git push
