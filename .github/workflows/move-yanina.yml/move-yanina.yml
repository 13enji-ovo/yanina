name: Move Yanina files
on:
  workflow_dispatch:
jobs:
  move:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img
          git mv img-00-1f90e25f.webp img/ 2>/dev/null || mv img-00-1f90e25f.webp img/
          git mv img-01-c60e4200.webp img/ 2>/dev/null || mv img-01-c60e4200.webp img/
          git mv img-02-4abe11c2.webp img/ 2>/dev/null || mv img-02-4abe11c2.webp img/
          git mv img-03-e022895c.webp img/ 2>/dev/null || mv img-03-e022895c.webp img/
          git mv img-04-502fd465.webp img/ 2>/dev/null || mv img-04-502fd465.webp img/
          git mv img-05-994b5d7b.webp img/ 2>/dev/null || mv img-05-994b5d7b.webp img/
          git mv img-06-8f49799a.webp img/ 2>/dev/null || mv img-06-8f49799a.webp img/
          git mv img-07-ad2082e8.webp img/ 2>/dev/null || mv img-07-ad2082e8.webp img/
          git mv img-14-d5cb062d.jpg img/ 2>/dev/null || mv img-14-d5cb062d.jpg img/
          git mv img-15-f6adfe9d.jpg img/ 2>/dev/null || mv img-15-f6adfe9d.jpg img/
          git mv img-16-f76bfd6c.jpg img/ 2>/dev/null || mv img-16-f76bfd6c.jpg img/
          git mv img-17-8e74e763.jpg img/ 2>/dev/null || mv img-17-8e74e763.jpg img/
          git mv tienda-index-external.html tienda/index.html
          git config user.name "muse-bot"
          git config user.email "muse-bot@users.noreply.github.com"
          git add -A
          git commit -m "Yanina store: external images, fix broken product images" || echo "nothing to commit"
          git push
 
