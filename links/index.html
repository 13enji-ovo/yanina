<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Yanina — Tu celu, tu estilo.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #fff5f9;
        --bg-wash: #ffe9f4;
        --dot: rgba(241, 124, 176, 0.38);
        --card: #ffffff;
        --card-border: #f9d7e5;
        --ink: #47222f;
        --muted: #a06a7d;
        --accent: #d93a73;
        --accent-deep: #b92a5c;
        --icon-bg: #fdeef5;
        --switch-bg: #ffffff;
        --switch-border: #f6cfe0;
        --switch-ink: #a06a7d;
        --shadow: 0 10px 28px rgba(185, 42, 92, 0.12);
        --avatar-ring: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Quicksand", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 90% 46% at 50% -6%, var(--bg-wash) 0%, transparent 70%),
          radial-gradient(circle, var(--dot) 3px, transparent 3.4px);
        background-size: 100% 100%, 26px 26px;
        background-position: 0 0, 0 0;
        color: var(--ink);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        max-width: 480px;
        margin: 0 auto;
        padding: 28px 20px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* Language switcher */
      .lang-switch {
        display: inline-flex;
        background: var(--switch-bg);
        border: 1.5px solid var(--switch-border);
        border-radius: 999px;
        padding: 4px;
        gap: 2px;
        box-shadow: var(--shadow);
      }
      .lang-switch button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--switch-ink);
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        padding: 7px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease;
      }
      .lang-switch button.active {
        background: var(--accent);
        color: #fff;
      }
      .lang-switch button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Profile */
      .avatar {
        margin-top: 36px;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid var(--avatar-ring);
        box-shadow: 0 14px 34px rgba(185, 42, 92, 0.22);
        background: #fdeef3;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: center;
      }
      .tagline {
        margin: 2px 0 0;
        font-family: "Great Vibes", cursive;
        font-size: 30px;
        line-height: 1.3;
        color: var(--accent);
        text-align: center;
      }
      /* Links */
      .links {
        margin-top: 34px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .link-card {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        padding: 18px 20px;
        background: var(--card);
        border: 1.5px solid var(--card-border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        text-decoration: none;
        color: var(--ink);
        transition: transform 0.18s ease, border-color 0.18s ease;
      }
      .link-card:hover { transform: translateY(-2px); border-color: var(--accent); }
      .link-card:active { transform: translateY(0); }
      .link-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .link-card.primary {
        background: linear-gradient(120deg, #ec4d8a, #d92b68);
        border-color: transparent;
        color: #fff;
      }
      .link-card.primary .link-sub { color: rgba(255, 255, 255, 0.85); }
      .link-card.primary .link-icon { background: rgba(255, 255, 255, 0.22); color: #fff; }
      .link-card.primary .chev { color: rgba(255, 255, 255, 0.8); }
      .link-icon {
        flex: 0 0 auto;
        width: 50px;
        height: 50px;
        border-radius: 14px;
        background: var(--icon-bg);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .link-icon svg { width: 26px; height: 26px; display: block; }
      .link-text { flex: 1 1 auto; min-width: 0; }
      .link-title {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.25;
      }
      .link-sub {
        margin-top: 3px;
        font-size: 14.5px;
        font-weight: 500;
        color: var(--muted);
        line-height: 1.35;
      }
      .chev {
        flex: 0 0 auto;
        color: var(--muted);
        display: flex;
      }
      .chev svg { width: 20px; height: 20px; display: block; }
      footer {
        margin-top: 36px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--muted);
        text-align: center;
      }
      footer .heart { color: var(--accent); }
      @media (prefers-reduced-motion: reduce) {
        .link-card, .lang-switch button { transition: none; }
        .link-card:hover { transform: none; }
      }
    </style>
  </head>

        <button type="button" data-lang="es" class="active">ES</button>
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>
