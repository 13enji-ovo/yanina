<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Yanina — Tu celu, tu estilo.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #fff5f9;
        --bg-wash: #ffe9f4;
        --dot: rgba(241, 124, 176, 0.38);
        --card: #ffffff;
        --card-border: #f9d7e5;
        --ink: #47222f;
        --muted: #a06a7d;
        --accent: #d93a73;
        --accent-deep: #b92a5c;
        --icon-bg: #fdeef5;
        --switch-bg: #ffffff;
        --switch-border: #f6cfe0;
        --switch-ink: #a06a7d;
        --shadow: 0 10px 28px rgba(185, 42, 92, 0.12);
        --avatar-ring: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Quicksand", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(ellipse 90% 46% at 50% -6%, var(--bg-wash) 0%, transparent 70%),
          radial-gradient(circle, var(--dot) 3px, transparent 3.4px);
        background-size: 100% 100%, 26px 26px;
        background-position: 0 0, 0 0;
        color: var(--ink);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        max-width: 480px;
        margin: 0 auto;
        padding: 28px 20px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* Language switcher */
      .lang-switch {
        display: inline-flex;
        background: var(--switch-bg);
        border: 1.5px solid var(--switch-border);
        border-radius: 999px;
        padding: 4px;
        gap: 2px;
        box-shadow: var(--shadow);
      }
      .lang-switch button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--switch-ink);
        font: inherit;
        font-weight: 700;
        font-size: 14px;
        padding: 7px 18px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease;
      }
      .lang-switch button.active {
        background: var(--accent);
        color: #fff;
      }
      .lang-switch button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Profile */
      .avatar {
        margin-top: 36px;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid var(--avatar-ring);
        box-shadow: 0 14px 34px rgba(185, 42, 92, 0.22);
        background: #fdeef3;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: center;
      }
      .tagline {
        margin: 2px 0 0;
        font-family: "Great Vibes", cursive;
        font-size: 30px;
        line-height: 1.3;
        color: var(--accent);
        text-align: center;
      }
      /* Links */
      .links {
        margin-top: 34px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .link-card {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        padding: 18px 20px;
        background: var(--card);
        border: 1.5px solid var(--card-border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        text-decoration: none;
        color: var(--ink);
        transition: transform 0.18s ease, border-color 0.18s ease;
      }
      .link-card:hover { transform: translateY(-2px); border-color: var(--accent); }
      .link-card:active { transform: translateY(0); }
      .link-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .link-card.primary {
        background: linear-gradient(120deg, #ec4d8a, #d92b68);
        border-color: transparent;
        color: #fff;
      }
      .link-card.primary .link-sub { color: rgba(255, 255, 255, 0.85); }
      .link-card.primary .link-icon { background: rgba(255, 255, 255, 0.22); color: #fff; }
      .link-card.primary .chev { color: rgba(255, 255, 255, 0.8); }
      .link-icon {
        flex: 0 0 auto;
        width: 50px;
        height: 50px;
        border-radius: 14px;
        background: var(--icon-bg);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .link-icon svg { width: 26px; height: 26px; display: block; }
      .link-text { flex: 1 1 auto; min-width: 0; }
      .link-title {
        font-size: 19px;
        font-weight: 700;
        line-height: 1.25;
      }
      .link-sub {
        margin-top: 3px;
        font-size: 14.5px;
        font-weight: 500;
        color: var(--muted);
        line-height: 1.35;
      }
      .chev {
        flex: 0 0 auto;
        color: var(--muted);
        display: flex;
      }
      .chev svg { width: 20px; height: 20px; display: block; }
      footer {
        margin-top: 36px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--muted);
        text-align: center;
      }
      footer .heart { color: var(--accent); }
      @media (prefers-reduced-motion: reduce) {
        .link-card, .lang-switch button { transition: none; }
        .link-card:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="lang-switch" role="group" aria-label="Idioma / Language / 语言">
        <button type="button" data-lang="es" class="active">ES</button>
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">EN</button>
      </div>

      <img class="avatar" src="img/avatar.webp" alt="Yanina" width="132" height="132" />
      <h1>Yanina</h1>
      <p class="tagline">Tu celu, tu estilo.</p>

      <nav class="links" aria-label="Yanina links">
        <a class="link-card primary" href="https://13enji-ovo.github.io/yanina/tienda/" target="_blank" rel="noopener">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h15l-1.7 8.5a2 2 0 0 1-2 1.5H8.6a2 2 0 0 1-2-1.6L4.4 3.8A1 1 0 0 0 3.4 3H1.5"/><circle cx="9" cy="21" r="1.4"/><circle cx="17.5" cy="21" r="1.4"/></svg>
          </span>
          <span class="link-text">
            <span class="link-title" data-i18n="storeTitle">Tienda Yanina</span>
            <span class="link-sub" data-i18n="storeSub" style="display:block">Entra y mira las fundas de la tienda</span>
          </span>
          <span class="chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
          </span>
        </a>

        <a class="link-card" href="https://www.tiktok.com/@yanina4501" target="_blank" rel="noopener">
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2.1 1.8 3.6 4 3.9v3c-1.6 0-3-.5-4-1.3v6.6c0 3.9-2.6 6.3-6 6.3A5.9 5.9 0 0 1 4.7 15c.3-3.2 2.8-5.4 6-5.2v3.1c-1.4-.3-2.8.6-3 2-.2 1.5 1 2.8 2.5 2.8 1.7 0 2.9-1.2 2.9-3.2V3h3.5Z"/></svg>
          </span>
          <span class="link-text">
            <span class="link-title">TikTok</span>
            <span class="link-sub" style="display:block">@yanina4501</span>
          </span>
          <span class="chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>

        </a>

        <a class="link-card" href="https://wa.me/593989022077" target="_blank" rel="noopener">
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.23 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.14.16-.29.18-.54.06-.25-.12-1.05-.38-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.51.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.13-.56-1.35-.77-1.84-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.6.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.16-.48-.28Z"/></svg>
          </span>
          <span class="link-text">
            <span class="link-title">WhatsApp</span>
            <span class="link-sub" data-i18n="waSub" style="display:block">Escríbenos por WhatsApp</span>
          </span>
          <span class="chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
          </span>
        </a>

        <a class="link-card" href="https://www.facebook.com/share/1KwvdPv6eJ/?mibextid=wwXIfr" target="_blank" rel="noopener">
          <span class="link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7h2.4l.4-3h-2.8V9.1c0-.9.3-1.5 1.6-1.5h1.3V4.9c-.3 0-1.1-.1-2-.1-2 0-3.4 1.2-3.4 3.5V11H8.5v3H11v7h2.5Z"/></svg>
          </span>
          <span class="link-text">
            <span class="link-title">Facebook</span>
            <span class="link-sub" data-i18n="fbSub" style="display:block">Síguenos en Facebook</span>
          </span>
          <span class="chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
          </span>
        </a>
      </nav>

      <footer><span data-i18n="footer">Gracias por visitarnos</span> <span class="heart" aria-hidden="true">♥</span></footer>
    </main>

    <script>
      var I18N = {
        es: {
          htmlLang: "es",
          storeTitle: "Tienda Yanina",
          storeSub: "Entra y mira las fundas de la tienda",
          waSub: "Escríbenos por WhatsApp",
          fbSub: "Síguenos en Facebook",
          footer: "Gracias por visitarnos"
        },
        zh: {
          htmlLang: "zh-CN",
          storeTitle: "Yanina 商店",
          storeSub: "进来看看店里在售的手机壳",
          waSub: "用 WhatsApp 联系我们",
          fbSub: "在 Facebook 上关注我们",
          footer: "谢谢你的访问"
        },
        en: {
          htmlLang: "en",
          storeTitle: "Yanina Store",
          storeSub: "Come in and see what's for sale",
          waSub: "Message us on WhatsApp",
          fbSub: "Follow us on Facebook",
          footer: "Thanks for stopping by"
        }
      };

      function setLang(lang) {
        var dict = I18N[lang] || I18N.es;
        document.documentElement.lang = dict.htmlLang;
        var nodes = document.querySelectorAll("[data-i18n]");
        for (var i = 0; i < nodes.length; i++) {
          var key = nodes[i].getAttribute("data-i18n");
          if (dict[key]) nodes[i].textContent = dict[key];
        }
        var buttons = document.querySelectorAll(".lang-switch button");
        for (var j = 0; j < buttons.length; j++) {
          buttons[j].classList.toggle("active", buttons[j].getAttribute("data-lang") === lang);
        }
      }

      var switchButtons = document.querySelectorAll(".lang-switch button");
      for (var k = 0; k < switchButtons.length; k++) {
        switchButtons[k].addEventListener("click", function () {
          setLang(this.getAttribute("data-lang"));
        });
      }
    </script>
  </body>
</html>
